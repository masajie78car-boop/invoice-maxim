<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Invoice Maxim Final</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{background:#dcdcdc;font-family:'Inter',sans-serif}

/* A4 */
.page{
width:210mm;height:297mm;background:#fff;margin:auto;
padding:18mm;box-sizing:border-box;position:relative;
}

/* LOGO */
.logo svg{height:26px}

/* LINE */
.line{height:2px;background:#f5b800;margin:10px 0 25px}

/* HEADER */
.header{display:flex;justify-content:space-between}
.title{font-size:44px;font-weight:800}

/* DATE */
.date{
border:1.5px solid #aaa;border-radius:12px;
padding:12px 16px;display:flex;gap:10px;align-items:center;
}

/* SECTION */
.section{margin-top:18px}
.label{font-size:13px;color:#666;margin-bottom:5px}
.row{display:flex;gap:8px}

/* SEPARATOR */
.sep{height:1.5px;background:#cfcfcf;margin:15px 0}

/* TABLE */
.table{
margin-top:20px;
border:2px solid #999;
border-radius:12px;
overflow:hidden;
}
.table-head{
display:flex;
background:linear-gradient(#ffc400,#ffb300);
font-weight:700;
border-bottom:2px solid #999;
}
.table-head div{flex:1;padding:12px}

.table-row{
display:flex;
border-top:1.5px dashed #bbb;
}
.table-row div{flex:1;padding:12px}

.table-row div:nth-child(2),
.table-head div:nth-child(2){
border-left:2px solid #999;
}

.total{font-weight:800;font-size:18px}

/* BOX */
.box{
margin-top:20px;
border:2px solid #ffc400;
border-radius:12px;
padding:15px;
display:flex;
align-items:flex-start;
gap:15px;
}

/* ICON */
.icon{
width:52px;height:52px;
background:#ffc400;border-radius:50%;
display:flex;align-items:center;justify-content:center;
}

/* NOTE */
.note{text-align:center;margin-top:10px;font-size:12px}

/* BADGE */
.badge{
position:absolute;
right:18mm;
bottom:18mm;
text-align:right;
}

.thank{
font-family:"Brush Script MT",cursive;
font-size:28px;
margin-bottom:5px;
}

.maxim{
background:#ffc400;
padding:6px 10px;
border-radius:6px;
display:inline-flex;
align-items:center;
gap:5px;
font-weight:700;
}

/* TIPE MOBIL TEXT */
.tipe{
margin-top:6px;
font-weight:700;
font-size:13px;
border-top:3px solid red;
display:inline-block;
padding-top:2px;
}

/* FORM */
.form{
max-width:500px;margin:20px auto;background:#fff;
padding:15px;border-radius:10px
}
input,select,textarea{width:100%;padding:8px;margin:5px 0}
textarea{height:60px;resize:none}
button{width:100%;padding:10px;margin-top:5px}
</style>
</head>

<body>

<div id="invoice" class="page">

<!-- LOGO -->
<div class="logo">
<svg viewBox="0 0 120 30">
<text x="0" y="22" font-size="22" font-weight="700">ma</text>
<text x="35" y="22" font-size="22" fill="#ff3b30" font-weight="700">x</text>
<text x="50" y="22" font-size="22" font-weight="700">im</text>
<circle cx="70" cy="6" r="3" fill="#ffc400"/>
</svg>
</div>

<div class="line"></div>

<div class="header">
<div class="title">INVOICE</div>

<div class="date">
<svg width="24" height="24" stroke="#ffc400" fill="none">
<rect x="3" y="5" width="18" height="16" rx="3"/>
<line x1="3" y1="9" x2="21" y2="9"/>
</svg>
<div>
<div style="font-size:11px;color:#777">TANGGAL</div>
<div id="tgl"></div>
</div>
</div>
</div>

<div class="section">
<div class="label">DITERBITKAN UNTUK</div>
<div class="row">
<div style="width:100px"><b>Nama</b></div>
<div>:</div>
<div id="nama"></div>
</div>
</div>

<div class="sep"></div>

<div class="section">
<div class="label">DETAIL PEMAKAIAN</div>
<div id="pakai"></div>
</div>

<div class="sep"></div>

<div class="table">
<div class="table-head">
<div>DESKRIPSI</div>
<div>JUMLAH</div>
</div>

<div class="table-row">
<div>Layanan Transportasi</div>
<div id="harga"></div>
</div>

<div class="table-row">
<div class="total">TOTAL</div>
<div class="total" id="total"></div>
</div>
</div>

<div class="box">
<div class="icon">
<svg width="24" height="24">
<rect x="4" y="4" width="14" height="16" rx="2" stroke="#000" fill="none"/>
</svg>
</div>
<div>
<div style="font-size:12px;color:#777">TERBILANG</div>
<div id="terbilang"></div>
</div>
</div>

<div class="box">
<div class="icon">
<svg width="28" height="20">
<rect x="2" y="8" width="24" height="8" rx="2" fill="#000"/>
<circle cx="7" cy="18" r="2"/>
<circle cx="21" cy="18" r="2"/>
</svg>
</div>
<div id="opsi"></div>
</div>

<div class="note">Terima kasih telah menggunakan layanan Maxim</div>

<!-- BADGE FINAL -->
<div class="badge">
<div class="thank">Thank You!</div>
<div class="maxim">🚕 maxim</div>
<div id="tipeText" class="tipe"></div>
</div>

</div>

<!-- FORM -->
<div class="form">
<input id="iNama" placeholder="Nama">
<input type="date" id="iTanggal">

<textarea id="iPakai" placeholder="Pemakaian (2 baris)"></textarea>

<input type="number" id="iHarga" placeholder="Harga">
<input id="iTerbilang" placeholder="Terbilang">

<select id="iOpsi">
<option value="">Pilih biaya</option>
<option>Parking</option>
<option>Toll</option>
<option>Parking & Toll</option>
</select>

<select id="iTipe">
<option>Premium Car</option>
<option>Standart Car</option>
</select>

<button onclick="gen()">Preview</button>
<button onclick="pdf()">Download PDF A4</button>
<button onclick="img()">Download Gambar A4</button>
</div>

<script>
iTanggal.valueAsDate=new Date();

function rp(x){return x?("Rp "+Number(x).toLocaleString("id-ID")):""}

function gen(){
nama.innerText=iNama.value;
tgl.innerText=iTanggal.value;
harga.innerText=rp(iHarga.value);
total.innerText=rp(iHarga.value);
terbilang.innerText=iTerbilang.value;

opsi.innerText=iOpsi.value?("Including "+iOpsi.value):"";

/* PEMAKAIAN 2 PARAGRAF */
pakai.innerHTML = iPakai.value.replace(/\n/g,"<br>");

/* TIPE MOBIL */
tipeText.innerText = iTipe.value.toUpperCase();
}

async function pdf(){
const { jsPDF } = window.jspdf;
let c=await html2canvas(invoice,{scale:3});
let img=c.toDataURL("image/png");
let pdf=new jsPDF('p','mm','a4');
pdf.addImage(img,'PNG',0,0,210,297);
pdf.save("invoice.pdf");
}

function img(){
html2canvas(invoice,{scale:3}).then(c=>{
let a=document.createElement("a");
a.href=c.toDataURL();
a.download="invoice.png";
a.click();
});
}
</script>

</body>
</html>
